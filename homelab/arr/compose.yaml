x-common: &common
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Ho_Chi_Minh
    dns:
      - 1.1.1.1
      - 1.0.0.1

# https://wiki.servarr.com/
# https://github.com/automation-avenue/arr-new/blob/main/docker-compose.yml
services:
  ###############################################
  # RADARR - Movies
  ###############################################
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.1.1
    container_name: radarr
    ports:
      - 7878:7878
    volumes:
      - ./config/radarr:/config
      - ./data/movies:/movies #optional
      - ./data/downloads:/downloads #optional
